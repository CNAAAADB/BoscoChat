name: One-time dependency security remediation for BoscoChat branding branch

on:
  push:
    branches: [feat/bc-brand-boscochat-logo-20261118]
    paths: [.github/workflows/brand-branch-dependency-remediation.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve audited dependency updates in existing lockfiles
        run: |
          set -euo pipefail
          (cd frontend && npm audit fix --force --package-lock-only --ignore-scripts)
          (cd backend && npm audit fix --force --package-lock-only --ignore-scripts)
      - name: Verify frontend and backend dependencies, builds and audits
        run: |
          set -euo pipefail
          (cd frontend && npm ci && npm run lint && npm run build && npm audit --audit-level=high)
          (cd backend && npm ci && npm test && npm run build && npm audit --audit-level=high)
      - name: Remove this one-off workflow and commit lockfile updates
        run: |
          set -euo pipefail
          git config user.name 'boscochat-dependency-maintenance[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brand-branch-dependency-remediation.yml
          git add frontend/package.json frontend/package-lock.json backend/package.json backend/package-lock.json
          git commit -m "chore(security): resolve vulnerable dev dependencies and remove one-off updater"
          git push origin HEAD:feat/bc-brand-boscochat-logo-20261118
