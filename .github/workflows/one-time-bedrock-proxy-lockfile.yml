name: One-time audited Bedrock proxy SDK lock update

on:
  pull_request:
    paths: [.github/workflows/one-time-bedrock-proxy-lockfile.yml]

permissions:
  contents: write

jobs:
  resolve-and-verify:
    if: github.head_ref == 'feat/bc101-admin-bedrock-chat-20261119' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bc101-admin-bedrock-chat-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Lambda invocation SDK
        run: |
          set -euo pipefail
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit)
      - name: Verify build, tests and npm security audits
        run: |
          set -euo pipefail
          (cd backend && npm ci && npm run build && npm test && npm audit --audit-level=high)
          (cd frontend && npm ci && npm run lint && npm run build && npm audit --audit-level=high)
      - name: Store reproducible lockfile and self-delete one-time updater
        run: |
          set -euo pipefail
          git config user.name 'boscochat-dependency-maintenance[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-bedrock-proxy-lockfile.yml
          git add backend/package-lock.json backend/package.json
          git commit -m 'build(BC-102): lock audited private Lambda invoke SDK'
          git push origin HEAD:feat/bc101-admin-bedrock-chat-20261119
