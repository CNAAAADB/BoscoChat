name: Build, test and package BoscoChat

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/lambda-package.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/lambda-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Lint and syntax checks
        working-directory: backend
        run: npm run lint

      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Install production dependencies
        working-directory: backend
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          chmod +x run.sh

      - name: Build Lambda zip
        working-directory: backend
        run: zip -r ../boscochat-backend-lambda.zip . -x 'test/*' '.env' '*.env'

      - name: Upload Lambda deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: boscochat-backend-lambda
          path: boscochat-backend-lambda.zip
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test browser-tab conversation persistence
        working-directory: frontend
        run: node --test test/chat-session.test.js

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high


  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-root-password
          MYSQL_DATABASE: boscochat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest-only-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: test-only-root-password
      DB_NAME: boscochat
      DB_SSL_MODE: disable
      DB_CONNECTION_LIMIT: '10'
      MYSQL_INTEGRATION: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run schema migration on MySQL 8
        working-directory: backend
        run: npm run migrate

      - name: Test shared limiter and concurrent administration
        working-directory: backend
        run: node --test test/mysql.integration.test.js
